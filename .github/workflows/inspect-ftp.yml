name: Inspect Hostinger FTP (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Test isolated FTP login and identify path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Probe without writing any files
        run: python3 scripts/check_ftp.py
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SECURE: ${{ vars.FTP_SECURE || 'true' }}
