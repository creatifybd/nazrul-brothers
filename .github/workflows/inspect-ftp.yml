name: Inspect Hostinger FTP (read-only)

on:
  # A read-only probe runs once when this diagnostic workflow is updated.
  # No schedule and no deployment from this workflow.
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-ftp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Test isolated FTP login and identify path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Inspect FTPS certificate names (no login or file access)
        shell: bash
        run: |
          set -o pipefail
          timeout 18 openssl s_client -starttls ftp -connect "${FTP_SERVER}:21" -showcerts </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName -dates
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
      - name: Probe without writing any files
        run: python3 scripts/check_ftp.py
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SECURE: ${{ vars.FTP_SECURE || 'true' }}
